# Streamlit Configuration
# Save this as .streamlit/config.toml in your project root

[theme]
primaryColor = "#667eea"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "developer"

[logger]
level = "info"

[client.showErrorDetails]
showErrorDetails = true
